trigger:
  - main

variables:
  vmImageName: 'ubuntu-latest'

stages:
 ## Sandbox BUILD
- stage: Discovery_Custom_SDK_Sandbox_Build
  displayName: 'Sandbox Build Stage'

  jobs:
  - job: Build
    displayName: 'Discovery_Custom-SDK_Build_Sandbox_Build'
    pool:
      vmImage: $(vmImageName)

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Install Node.js'

    - script: |
        cd '$(System.DefaultWorkingDirectory)/dist/custom-sdk'
        npm install -g @angular/cli
        npm install --force
        npx ng build --configuration=sandbox
      displayName: 'npm install and build'

    - task: CopyFiles@2
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)'
        contents: 'package.json' 
        targetFolder: $(Build.ArtifactStagingDirectory)/distsandbox
      displayName: 'Copy package.json'   

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/dist/custom-sdk'
        artifactName: distsandbox
      displayName: 'Publish distdev artifact'
 
 ## Sandbox Deployment
- stage: Sandbox_Deployment
  displayName: 'Custom SDK Sandbox Deployment'
  dependsOn: Discovery_Custom_SDK_Sandbox_Build
  condition: succeeded()

  jobs: 
  - deployment: Deploy
    displayName: 'Deploy'
    environment: 'Custom SDK Sandbox Deployment'
    pool:
      vmImage: $(vmImageName)
    
    strategy:
      runOnce:
        deploy:

          steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              source: 'current'
              artifact: 'distsandbox'
              path: '$(Build.ArtifactStagingDirectory)\\dist'
            displayName: 'Download artifact'

          - task: AzureStaticWebApp@0
            displayName: Sandbox Deployment
            inputs:
              workingDirectory: '$(Build.ArtifactStagingDirectory)\\dist'
              app_location: '/browser/'
              azure_static_web_apps_api_token: '$(Sandbox Token)'

## Production BUILD
- stage: Discovery_Custom_SDK_Production_Build
  displayName: 'Production Build Stage'

  jobs:
  - job: Build
    displayName: 'Discovery_Custom-SDK_Build_Production_Build'
    pool:
      vmImage: $(vmImageName)

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Install Node.js'

    - script: |
        cd '$(System.DefaultWorkingDirectory)/dist/custom-sdk'
        npm install -g @angular/cli
        npm install --force
        npx ng build --configuration=production
      displayName: 'npm install and build'

    - task: CopyFiles@2
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)'
        contents: 'package.json' 
        targetFolder: $(Build.ArtifactStagingDirectory)/distprod
      displayName: 'Copy package.json'   

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/dist/custom-sdk'
        artifactName: distprod
      displayName: 'Publish distdev artifact'
 
 ## Production Deployment
- stage: Production_Deployment
  displayName: 'Custom SDK Production Deployment'
  dependsOn: Discovery_Custom_SDK_Production_Build
  condition: succeeded()

  jobs: 
  - deployment: Deploy
    displayName: 'Deploy'
    environment: 'Custom SDK Production Deployment'
    pool:
      vmImage: $(vmImageName)
    
    strategy:
      runOnce:
        deploy:

          steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              source: 'current'
              artifact: 'distprod'
              path: '$(Build.ArtifactStagingDirectory)\\dist'
            displayName: 'Download artifact'

          - task: AzureStaticWebApp@0
            displayName: Production Deployment
            inputs:
              workingDirectory: '$(Build.ArtifactStagingDirectory)\\dist'
              app_location: '/browser/'
              azure_static_web_apps_api_token: '$(ProdSdkToken)'