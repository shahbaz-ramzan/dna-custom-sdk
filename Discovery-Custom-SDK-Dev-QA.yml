trigger:
  - development

variables:
  vmImageName: 'ubuntu-latest'
  
 ## DEV BUILD

stages:
- stage: Discovery_Custom_SDK_Dev_Build
  displayName: 'Dev Build Stage'

  jobs:
  - job: Build
    displayName: 'Discovery_Custom-SDK_Build_Dev_Build'
    pool:
      vmImage: $(vmImageName)

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Install Node.js'

    - script: |
        cd '$(System.DefaultWorkingDirectory)/dist/custom-sdk'
        npm install -g @angular/cli
        npm install --force
        npx ng build --configuration=dev
      displayName: 'npm install and build'

    - task: CopyFiles@2
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)'
        contents: 'package.json' 
        targetFolder: $(Build.ArtifactStagingDirectory)/distdev
      displayName: 'Copy package.json'   

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/dist/custom-sdk'
        artifactName: distdev
      displayName: 'Publish distdev artifact'

## DEV DEPLOYMENT

- stage: Dev_Deployment
  displayName: 'Custom SDK Dev Deployment'
  dependsOn: Discovery_Custom_SDK_Dev_Build
  condition: succeeded()

  jobs: 
  - deployment: Deploy
    displayName: 'Deploy'
    environment: 'Custom SDK Dev Deployment'
    pool:
      vmImage: $(vmImageName)
    
    strategy:
      runOnce:
        deploy:

          steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              source: 'current'
              artifact: 'distdev'
              path: '$(Build.ArtifactStagingDirectory)\\dist'
            displayName: 'Download artifact'

          - task: AzureStaticWebApp@0
            displayName: Dev Deployment
            inputs:
              workingDirectory: '$(Build.ArtifactStagingDirectory)\\dist'
              app_location: '/browser/'
              azure_static_web_apps_api_token: '$(DEV Token)'

## QA BUILD

- stage: Discovery_Custom_SDK_QA_Build
  displayName: 'QA Build Stage'

  jobs:
  - job: Build
    displayName: 'Discovery_Custom-SDK_Build_QA_Build'
    pool:
      vmImage: $(vmImageName)

    steps:
    - task: NodeTool@0
      inputs:
        versionSpec: '18.x'
      displayName: 'Install Node.js'

    - script: |
        cd '$(System.DefaultWorkingDirectory)/dist/custom-sdk'
        npm install -g @angular/cli
        npm install --force
        npx ng build --configuration=qa
      displayName: 'npm install and build'

    - task: CopyFiles@2
      inputs:
        sourceFolder: '$(Build.SourcesDirectory)'
        contents: 'package.json' 
        targetFolder: $(Build.ArtifactStagingDirectory)/distqa
      displayName: 'Copy package.json'   

    - task: PublishPipelineArtifact@1
      inputs:
        targetPath: '$(System.DefaultWorkingDirectory)/dist/custom-sdk'
        artifactName: distqa
      displayName: 'Publish distdev artifact'

## QA DEPLOYMENT

- stage: QA_Deployment
  displayName: 'Custom SDK QA Deployment'
  dependsOn: Discovery_Custom_SDK_QA_Build
  condition: succeeded()

  jobs: 
  - deployment: Deploy
    displayName: 'Deploy'
    environment: 'Custom SDK QA Deployment'
    pool:
      vmImage: $(vmImageName)
    
    strategy:
      runOnce:
        deploy:

          steps:
          - task: DownloadPipelineArtifact@2
            inputs:
              source: 'current'
              artifact: 'distqa'
              path: '$(Build.ArtifactStagingDirectory)\\dist'
            displayName: 'Download artifact'

          - task: AzureStaticWebApp@0
            displayName: QA Deployment
            inputs:
              workingDirectory: '$(Build.ArtifactStagingDirectory)\\dist'
              app_location: '/browser/'
              azure_static_web_apps_api_token: '$(QA Token)'