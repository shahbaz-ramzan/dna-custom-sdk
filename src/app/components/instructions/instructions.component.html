<div class="bg-white">
  <header
    data-testId="header"
    class="navbar-light d-flex justify-content-between pt-5 align-items-center container"
  >
    <img data-testId="logo" [src]="logo" class="maxheight-40" alt="" />
    <p-dropdown
      [options]="countries"
      [(ngModel)]="selectedLang"
      (onChange)="onLanguageChange()"
      optionLabel="name"
      [showClear]="false"
      class="select-language"
      placeholder="Select a Language"
    >
      <ng-template pTemplate="selectedItem">
        <div class="flex align-items-center gap-2" *ngIf="selectedLang">
          <img src="{{ selectedLang.flag }}" class="lang-flag" />
          <div>{{ selectedLang.name }}</div>
        </div>
      </ng-template>
      <ng-template let-country pTemplate="item">
        <div class="flex align-items-center gap-2">
          <img src="{{ country.flag }}" class="lang-flag" style="width: 24px" />
          <div>{{ country.name }}</div>
        </div>
      </ng-template>
    </p-dropdown>
  </header>

  <div class="discover-dna-wrap">
    <div class="container">
      <!-- <ul class="steper-progress mb-sm-5">
        <li class="active" data-testId="title">
          <span>Create Your Account</span>
        </li>
        <li class="current" data-testId="title-2">
          <span>Discover Your DNA</span>
        </li>
      </ul> -->
      <div class="row align-items-center instrunction-wrap flex-column-reverse">
        <div
          class="col-md-12 col-lg-6 pe-lg-5 mt-lg-0 mt-4"
          data-testId="instructions"
        >
          <p>{{ dummyText }}</p>
          <h2>
            {{ "popup-instructions-header" | translate : selectedLang.lang }}
          </h2>
          <p
            [innerHTML]="
              'popup-instructions-body' | translate : selectedLang.lang
            "
          ></p>
          <button
            data-testId="start-discovery-btn"
            pButton
            iconPos="right"
            class="submit-btn primary-btn mt-4"
            [label]="buttonTranslationKey | translate : selectedLang.lang"
            icon="pi pi-arrow-right"
            [disabled]="buttonTitle === 'Loading Discovery'"
            (click)="onClick()"
          ></button>
          <!-- <button
            data-testId="start-discovery-btn"
            pButton
            iconPos="right"
            class="submit-btn primary-btn mt-4"
            [label]="buttonTitle"
            [disabled]="loading"
            icon="pi pi-arrow-right"
            (click)="onClick()"
          ></button> -->
        </div>
        <div class="col-md-12 col-lg-6" data-testId="video-thumbnail-content">
          <div class="thumbnail-overlay position-relative">
            <img
              class="w-100"
              src="assets/images/welcome-image.png"
              alt="welcome-image"
            />
            <img
              (click)="showModalDialog()"
              class="position-absolute play-button"
              src="assets/images/play-button.png"
              alt="play-icon"
            />
            <h5 class="video-thumbnail-content">
              {{ "popup-instructions-header" | translate : selectedLang.lang }}
            </h5>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p-dialog
    [(visible)]="displayModal"
    [breakpoints]="{ '767px': '100%' }"
    [style]="{ maxWidth: '600px', width: '100%' }"
  >
    <iframe
      width="100%"
      height="315"
      [src]="instructionsVideo | safe"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </p-dialog>
</div>
